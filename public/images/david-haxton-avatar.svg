<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="David Haxton">
  <!--
    A little character, in the same world as the figures walking around the
    island. Colours are lifted straight from public/island.js: SKIN for the
    face, HAIR_OLD for the beard, ink for the body and the eyes. Solid fills
    and big simple shapes only, so it still reads at 60px.
  -->
  <rect width="100" height="100" fill="#FFB320"/>

  <!-- shoulders -->
  <path d="M50 73c19 0 33 11 36 27H14c3-16 17-27 36-27Z" fill="#1C1A3A"/>
  <path d="M50 73c3.4 0 6 3.4 6 7.6s-2.6 7.6-6 7.6-6-3.4-6-7.6 2.6-7.6 6-7.6Z" fill="#F4F3FB"/>

  <!-- ears -->
  <circle cx="25" cy="41" r="5" fill="#D9A57A"/>
  <circle cx="75" cy="41" r="5" fill="#D9A57A"/>

  <!-- big bald head, with a highlight on the crown -->
  <circle cx="50" cy="40" r="26" fill="#F3D2B3"/>
  <ellipse cx="40" cy="24" rx="10" ry="5.5" fill="#FFFFFF" opacity=".26"/>

  <!-- beard: frames the jaw and hangs past the chin, rather than covering
       the whole lower face as a blob -->
  <path d="M24 42c0 22 11 34 26 34s26-12 26-34c0 11-8 14-26 14s-26-3-26-14Z" fill="#9A948C"/>
  <path d="M24 42c0 8 8 11 26 11s26-3 26-11c0 6-2 9-5 11-4 2.6-10 3.4-21 3.4s-17-.8-21-3.4c-3-2-5-5-5-11Z" fill="#C9C9D1"/>
  <path d="M31 66c4.5 4 11 6.5 19 6.5s14.5-2.5 19-6.5c-2.4 6-9.6 10-19 10s-16.6-4-19-10Z" fill="#C9C9D1" opacity=".75"/>

  <!-- moustache, then a small smile sitting below it -->
  <path d="M37 50c3.5-2.8 8-3.2 13-3.2s9.5.4 13 3.2c-2.6 3-7 4.2-13 4.2s-10.4-1.2-13-4.2Z" fill="#C9C9D1"/>
  <path d="M42 57h16c0 5.4-3.6 9-8 9s-8-3.6-8-9Z" fill="#7A4435"/>
  <path d="M45.5 63c1.3-1 2.8-1.5 4.5-1.5s3.2.5 4.5 1.5c-1.3 1.7-2.8 2.6-4.5 2.6s-3.2-.9-4.5-2.6Z" fill="#F0867A"/>

  <!-- eyes, under the lenses -->
  <circle cx="38" cy="36" r="2.8" fill="#1C1A3A"/>
  <circle cx="62" cy="36" r="2.8" fill="#1C1A3A"/>

  <!-- glasses, sized to sit inside the face rather than straddle it -->
  <g fill="#FFFFFF" fill-opacity=".18" stroke="#4A3F36" stroke-width="3">
    <circle cx="38" cy="36" r="8.5"/>
    <circle cx="62" cy="36" r="8.5"/>
  </g>
  <path d="M46.5 36h7M29.5 34.5 25 36M70.5 34.5 75 36" stroke="#4A3F36" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- eyebrows, raised and friendly -->
  <path d="M30 24.5c3.6-2.4 7.6-2.6 11.2-1.1M58.8 23.4c3.6-1.5 7.6-1.3 11.2 1.1" stroke="#9A948C" stroke-width="3" stroke-linecap="round" fill="none"/>
</svg>
